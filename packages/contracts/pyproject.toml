[project]
name = "crowdfunding-contracts"
version = "0.0.0"
description = "Contratos versionados: eventos e endpoints síncronos tipados"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts"]
