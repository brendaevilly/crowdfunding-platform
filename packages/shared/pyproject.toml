[project]
name = "crowdfunding-shared"
version = "0.0.0"
description = "Utilitários compartilhados: HTTP, banco, outbox, correlation-id"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
