name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Testes (unitário + integração)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run pytest -m "not e2e" --cov --cov-report=term-missing

  e2e:
    name: E2E (sobe os microsserviços)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: Rodar E2E
        run: |
          if [ -d e2e ]; then
            uv run pytest e2e -m e2e -ra
          else
            echo "e2e/ ainda não existe (issues Q02/Q03); nada a rodar."
          fi
      - name: Logs dos serviços (em caso de falha)
        if: failure()
        run: |
          for f in logs/*.log; do [ -f "$f" ] && { echo "=== $f ==="; tail -n 200 "$f"; }; done || true

  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, test, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Todos os jobs obrigatórios passaram?
        run: |
          echo '${{ toJSON(needs) }}'
          ! echo '${{ join(needs.*.result, ' ') }}' | grep -E 'failure|cancelled'
