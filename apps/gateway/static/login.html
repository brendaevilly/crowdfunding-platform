<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — aporta.</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body style="background-color: var(--bg-secondary);">
  <!-- Header / Barra de Navegação Mínima -->
  <header class="app-header">
    <div class="header-container">
      <div class="logo-area">
        <a href="/" class="logo-link">aporta<span>.</span></a>
      </div>
      <div>
        <span style="font-size: 1.05rem; color: var(--text-muted); margin-right: 12px;">Não tem uma conta?</span>
        <a href="/cadastro.html" class="btn btn-secondary btn-sm">Cadastre-se</a>
      </div>
    </div>
  </header>

  <!-- Container de Autenticação -->
  <main class="main-content" style="display: flex; align-items: center; justify-content: center;">
    <div class="auth-page-container">
      <div class="auth-card">
        <div class="auth-card-header">
          <div class="auth-logo">aporta.</div>
          <h1>Entrar na sua conta</h1>
          <p>Informe suas credenciais para acessar o painel</p>
        </div>

        <!-- Alerta de Erro / Sucesso -->
        <div id="login-alert" class="alert-box error hidden"></div>

        <form id="form-login-standalone">
          <div class="form-group">
            <label for="login-email">E-mail</label>
            <input type="email" id="login-email" class="form-control" required placeholder="seu@email.com" autocomplete="email">
          </div>

          <div class="form-group" style="margin-top: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <label for="login-senha">Senha</label>
            </div>
            <input type="password" id="login-senha" class="form-control" required placeholder="Sua senha secreta" autocomplete="current-password">
          </div>

          <button type="submit" id="btn-submit-login" class="btn btn-primary btn-lg btn-block" style="margin-top: 24px;">
            Entrar na plataforma
          </button>
        </form>

        <div class="auth-footer-text">
          Ainda não tem conta? <a href="/cadastro.html">Cadastre-se gratuitamente</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Rodapé -->
  <footer class="app-footer">
    <div class="footer-container">
      <div class="footer-logo">aporta.</div>
      <div class="footer-tagline">Transparência em cada etapa.</div>
    </div>
  </footer>

  <script src="/static/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initLoginPage();
    });
  </script>
</body>
</html>
