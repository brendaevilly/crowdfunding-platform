[project]
name = "crowdfunding-notificacao"
version = "0.0.0"
description = "Notificação"
requires-python = ">=3.12"
dependencies = [
    "crowdfunding-shared",
    "crowdfunding-contracts",
]

[tool.uv.sources]
crowdfunding-shared = { workspace = true }
crowdfunding-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notificacao"]
