# Raiz do workspace uv. A issue F01 adiciona os membros (apps/*, packages/*).
[project]
name = "crowdfunding"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps", "packages"]
markers = ["e2e: testes ponta a ponta (sobem todos os serviços)"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps", "packages", "scripts", "tests"]
explicit_package_bases = true
mypy_path = [
    "scripts",
    "packages/shared/src",
    "packages/contracts/src",
    "apps/gateway/src",
    "apps/broker/src",
    "apps/identidade/src",
    "apps/campanhas/src",
    "apps/aportes/src",
    "apps/custodia_retornos/src",
    "apps/notificacao/src",
]

[[tool.mypy.overrides]]
module = ["tests.*", "test_check_commits", "test_arquitetura"]
disallow_untyped_defs = false
disallow_untyped_decorators = false
