# Raiz do workspace uv. A issue F01 adiciona os membros (apps/*, packages/*).
[project]
name = "crowdfunding"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps", "packages"]
markers = ["e2e: testes ponta a ponta (sobem todos os serviços)"]
addopts = "-ra"
